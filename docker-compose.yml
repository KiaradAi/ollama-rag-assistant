version: "3.8"

services:
  rag-assistant:
    build: .
    container_name: ollama-rag-assistant
    ports:
      - "8501:8501"
    volumes:
      - ./source_documents:/app/source_documents
      - ./chroma_db:/app/chroma_db
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    restart: unless-stopped
